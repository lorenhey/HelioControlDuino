name: Verificación Arduino

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6

      - name: Compilar y ejecutar pruebas de lógica
        run: |
          mkdir -p build
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Itest/host -Isrc \
            test/host/test_main.cpp \
            src/HelioTypes.cpp src/HelioController.cpp \
            src/SolarCalculator.cpp \
            -o build/helio-tests
          ./build/helio-tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6

      - name: Instalar Arduino Lint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-lint/main/etc/install.sh \
            | BINDIR="$HOME/.local/bin" sh -s 1.3.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validar la biblioteca
        run: arduino-lint --compliance strict --library-manager submit .

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - arduino:avr:uno
          - arduino:avr:mega

    steps:
      - name: Obtener el código
        uses: actions/checkout@v6

      - name: Instalar Arduino CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh -s 1.5.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar el core AVR y dependencias
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Servo

      - name: Compilar ejemplos y firmware
        env:
          FQBN: ${{ matrix.fqbn }}
        run: |
          set -euo pipefail
          for sketch in \
            examples/BasicDualAxis \
            examples/CompleteController \
            examples/SerialController \
            examples/SolarPosition
          do
            arduino-cli compile --warnings all --fqbn "$FQBN" \
              --library "$GITHUB_WORKSPACE" "$sketch"
          done
